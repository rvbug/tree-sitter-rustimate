[package]
name = "tree-sitter-rustimate"
description = "Tree-sitter grammar for the Rustimate Studio Language (RSL), a DSL for code-based storytelling and presentations"
version = "0.1.0"
authors = ["Rakesh Venkat <qubitai.in@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "tree-sitter-rustimate"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/rvbug/tree-sitter-rustimate"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = "0.26.5"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.5"
